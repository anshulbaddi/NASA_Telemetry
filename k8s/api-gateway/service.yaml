apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: rover-fleet
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 2112
      targetPort: 2112
  type: LoadBalancer
