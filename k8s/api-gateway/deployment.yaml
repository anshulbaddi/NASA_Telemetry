apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: rover-fleet
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
    spec:
      containers:
        - name: api-gateway
          image: REGISTRY/rover-api-gateway:TAG
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 2112
              name: metrics
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: OTEL_SERVICE_NAME
              value: api-gateway
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: brokers
          envFrom:
            - configMapRef:
                name: rover-fleet-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
