apiVersion: v1
kind: ConfigMap
metadata:
  name: rover-fleet-config
  namespace: rover-fleet
data:
  # These are non-secret configuration values. Secrets (broker auth, etc.)
  # are stored in AWS Secrets Manager and injected via External Secrets Operator.
  KAFKA_GROUP_ID: "rover-consumer-group"
  NUM_ROVERS: "50"
  MSGS_PER_ROVER_PER_SEC: "60"
  LOG_LEVEL: "info"
  METRICS_ADDR: ":2112"
  GRPC_KEEPALIVE_TIME: "10s"
  ANOMALY_CONTAMINATION: "0.05"
  OTEL_SERVICE_VERSION: "1.0.0"
